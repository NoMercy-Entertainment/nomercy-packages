name: 'Update Package Repository'

on:
  repository_dispatch:
    types: [release_published]
  # The Android APK is mirrored from nomercy-app-kmp, which is PRIVATE, so it
  # cannot dispatch here — an org secret does not reach a private repo on this
  # plan, so a token sent from there is empty. Without a schedule the APK only
  # refreshed when the MEDIA SERVER happened to release, which has nothing to do
  # with the app and left the public download stale in between.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if no changes detected'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
jobs:
  # Builds and checks the whole tree. It has no environment, so a run from a
  # branch (workflow_dispatch) can prove the build without being able to deploy.
  build:
    runs-on: [self-hosted, Linux, X64, beast-unit]
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      tracked: ${{ steps.check.outputs.tracked }}
      releases: ${{ steps.releases.outputs.releases }}

    steps:
      - uses: actions/checkout@v7

      - name: Get all releases from main repo
        id: releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch all releases (non-prerelease, non-draft), keep only latest 10
          # `gh api --paginate --jq FILTER` runs FILTER once per page, so wrapping
          # the filter in `[...]` emits one array PER PAGE instead of one merged
          # array — sort_by/join then ran per page too, producing several
          # comma-joined lines instead of one, which broke $GITHUB_OUTPUT below.
          # Emitting one scalar tag per line lets --paginate concatenate pages
          # as plain text; jq -R -s then slurps that into a single array.
          ALL_RELEASES=$(gh api repos/NoMercy-Entertainment/nomercy-media-server/releases --paginate \
            --jq '.[] | select(.prerelease == false and .draft == false) | .tag_name | ltrimstr("v")')
          RELEASES=$(echo "$ALL_RELEASES" | jq -R -s -r 'split("\n") | map(select(length > 0)) | sort_by(split(".") | map(tonumber)) | .[-10:] | join(",")')

          echo "Available releases: ${RELEASES}"

          # Use delimiter syntax for values containing commas
          EOF_DELIM=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "releases<<${EOF_DELIM}" >> $GITHUB_OUTPUT
          echo "${RELEASES}" >> $GITHUB_OUTPUT
          echo "${EOF_DELIM}" >> $GITHUB_OUTPUT

          # Get latest version for website display
          LATEST=$(echo "${RELEASES}" | tr ',' '\n' | sort -V | tail -1)
          echo "latest=${LATEST}" >> $GITHUB_OUTPUT
          echo "Latest version: ${LATEST}"

      - name: Check if sync needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          RELEASES="${{ steps.releases.outputs.releases }}"

          # A new ANDROID release is a change too. Without this the comparison
          # only tracked media-server versions, so the scheduled run that exists
          # to pick up a new APK would decide nothing had changed and skip the
          # very step it was scheduled for.
          APK_TAG=$(gh release list -R NoMercy-Entertainment/nomercy-app-kmp             --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
          RELEASES="${RELEASES} apk:${APK_TAG:-none}"
          echo "Android release: ${APK_TAG:-none}"
          echo "tracked=${RELEASES}" >> $GITHUB_OUTPUT

          if [ -f "deployed_versions.txt" ]; then
            DEPLOYED=$(cat deployed_versions.txt)
            if [ "$DEPLOYED" = "$RELEASES" ] && [ "${{ inputs.force }}" != "true" ]; then
              echo "skip=true" >> $GITHUB_OUTPUT
              echo "No changes detected, skipping"
            else
              echo "skip=false" >> $GITHUB_OUTPUT
              echo "Changes detected:"
              echo "  Deployed: ${DEPLOYED}"
              echo "  Available: ${RELEASES}"
            fi
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "No previous deployment found"
          fi

      - name: Create website directory
        if: steps.check.outputs.skip != 'true'
        run: mkdir -p ./website

      - name: Create Public Key File
        if: steps.check.outputs.skip != 'true'
        run: |
          echo "${{ vars.GPG_PUBLIC_KEY }}" > website/nomercy_repo.gpg.pub
          chmod 644 website/nomercy_repo.gpg.pub

      - name: Download packages for all releases
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p downloads

          RELEASES="${{ steps.releases.outputs.releases }}"
          IFS=',' read -ra VERSIONS <<< "$RELEASES"

          for VERSION in "${VERSIONS[@]}"; do
            echo "=== Downloading packages for v${VERSION} ==="
            RELEASE_URL="https://github.com/NoMercy-Entertainment/nomercy-media-server/releases/download/v${VERSION}"

            # Download DEB package
            curl -fL -o "downloads/nomercy_${VERSION}_amd64.deb" \
              "${RELEASE_URL}/nomercy_${VERSION}_amd64.deb" 2>/dev/null || rm -f "downloads/nomercy_${VERSION}_amd64.deb"

            # Download RPM package
            curl -fL -o "downloads/nomercy-${VERSION}-1.x86_64.rpm" \
              "${RELEASE_URL}/nomercy-${VERSION}-1.x86_64.rpm" 2>/dev/null || rm -f "downloads/nomercy-${VERSION}-1.x86_64.rpm"

            # Download Arch package
            curl -fL -o "downloads/nomercy-${VERSION}-1-x86_64.pkg.tar.zst" \
              "${RELEASE_URL}/nomercy-${VERSION}-1-x86_64.pkg.tar.zst" 2>/dev/null || rm -f "downloads/nomercy-${VERSION}-1-x86_64.pkg.tar.zst"
          done

          echo "=== All downloaded files ==="
          ls -la downloads/

          # Verify at least one DEB was downloaded
          if ! ls downloads/*.deb 1>/dev/null 2>&1; then
            echo "ERROR: No DEB packages found!"
            exit 1
          fi

      - name: Prepare signing keyring
        if: steps.check.outputs.skip != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # A temporary keyring, so the private key never lands in the runner's
          # own default keyring where it would outlive the job.
          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          echo "GNUPGHOME=${GNUPGHOME}" >> "$GITHUB_ENV"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --homedir "$GNUPGHOME" --batch --import

      - name: Build and sign the apt, rpm and pacman repositories
        if: steps.check.outputs.skip != 'true'
        env:
          LATEST: ${{ steps.releases.outputs.latest }}
        run: bash .github/scripts/build-repo.sh

      - name: Remove signing keyring
        if: always()
        run: |
          if [ -n "${GNUPGHOME:-}" ] && [ -d "${GNUPGHOME}" ]; then
            gpgconf --homedir "$GNUPGHOME" --kill gpg-agent || true
            rm -rf "$GNUPGHOME"
          fi

      - name: Generate Repository Website
        if: steps.check.outputs.skip != 'true'
        run: |
          LATEST="${{ steps.releases.outputs.latest }}"

          # Copy website templates
          cp -r .github/actions/generate-repository-website/templates/* website/ 2>/dev/null || true

          # Replace version placeholder with latest
          if [ -f "website/index.html" ]; then
            sed -i "s/{{VERSION}}/${LATEST}/g" website/index.html
          fi

          # Create assets directory and copy files
          mkdir -p website/assets
          cp .github/actions/generate-repository-website/templates/*.css website/assets/ 2>/dev/null || true
          cp .github/actions/generate-repository-website/templates/*.js website/assets/ 2>/dev/null || true

          # Create .nojekyll file
          touch website/.nojekyll

          # Create CNAME
          echo "repo.nomercy.tv" > website/CNAME

          echo "=== Website contents ==="
          find website -type f | head -50

      # The Android app is built in nomercy-app-kmp, which is private, so a
      # release asset URL there is only downloadable by someone with repo
      # access — the download button on nomercy.tv 404'd for everyone else.
      #
      # This repo pulls, rather than kmp pushing: org secrets do not reach a
      # PRIVATE repo on this plan, so a dispatch from kmp could never carry a
      # token (it sent an empty PAT and got a 401). This repo is public, so
      # secrets.PAT resolves here. It runs on every media-server release, which
      # is frequent, so the APK is never far behind — and workflow_dispatch
      # fetches it on demand.
      # This repo is already public and already fronted by repo.nomercy.tv, so
      # the APK rides along with the apt/rpm packages instead of needing new
      # hosting. Missing or unreachable is a warning, not a failure: the Linux
      # packages are this job's actual product.
      - name: Publish the Android APK
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          set -uo pipefail
          mkdir -p website/android

          TAG=$(gh release list -R NoMercy-Entertainment/nomercy-app-kmp             --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)

          if [ -z "${TAG:-}" ]; then
            echo "::warning::No release found in nomercy-app-kmp — skipping the APK."
            exit 0
          fi

          # Print what gh actually said. The first version of this step reported
          # "no .apk asset" for ANY non-zero exit, which sent me looking at the
          # release (it had one) instead of at the real error.
          if ! gh release download "$TAG" -R NoMercy-Entertainment/nomercy-app-kmp             --pattern "*.apk" --dir website/android --clobber 2>download.err; then
            echo "::warning::Could not download the APK from $TAG:"
            sed 's/^/::warning::  /' download.err || true
            echo "--- assets on that release ---"
            gh release view "$TAG" -R NoMercy-Entertainment/nomercy-app-kmp               --json assets --jq '.assets[].name' || true
            exit 0
          fi

          # A stable filename so the website can link to one URL forever, next
          # to the versioned one for anyone pinning a build.
          APK=$(find website/android -maxdepth 1 -name "*.apk" | head -n1)
          cp "$APK" website/android/nomercy.apk
          echo "$TAG" > website/android/latest.txt
          echo "Published $(basename "$APK") as android/nomercy.apk ($TAG)"

      - name: Check the built repository
        if: steps.check.outputs.skip != 'true'
        run: |
          bash tests/check-tree.sh website
          python3 tests/check-page.py website/index.html website
          if command -v node >/dev/null; then
            node tests/switch-tab.test.js
          else
            echo "::warning::node is not installed on this runner, skipped the page script test"
          fi

      - name: Upload Pages artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./website
          # v5 excludes dotfiles by default; website/.nojekyll (created above)
          # must survive so GitHub Pages does not run Jekyll over the repo
          # website and break the apt/rpm/arch asset paths.
          include-hidden-files: true

  # Deploys only from master. A failed build never reaches this job, so Pages
  # keeps serving the previous deploy (including android/nomercy.apk).
  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, Linux, X64, beast-unit]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Commit version tracker
        run: |
          echo "${{ needs.build.outputs.tracked }}" > deployed_versions.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployed_versions.txt
          git commit -m "Sync with releases: ${{ needs.build.outputs.releases }}" || echo "No changes to commit"
          git push
