name: Verify self-hosted Maven

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      # Generate hashes in this disposable consumer, then require them during a
      # second fresh resolution. The second run must use strict verification.
      - name: Record resolved artifact hashes
        run: gradle -p tests/maven-consumer resolveMaven --write-verification-metadata sha256 --refresh-dependencies
      - name: Resolve Android and JVM artifacts with strict verification
        run: gradle -p tests/maven-consumer resolveMaven --dependency-verification strict --refresh-dependencies
